<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="popupTitle">TabPal</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-text">
        <h1 data-i18n="popupTitle">TabPal</h1>
        <p class="subtitle" data-i18n="popupSubtitle">Save & restore your tabs</p>
      </div>
      <button id="open-options" class="icon-btn" type="button" data-i18n-title="openOptions" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9.4 4.5a7.7 7.7 0 0 0 0-1l2-1.6-2-3.4-2.4.9a7.4 7.4 0 0 0-1.7-1L16.8 4h-4l-.5 2.4a7.4 7.4 0 0 0-1.7 1l-2.4-.9-2 3.4L8.2 11.5a7.7 7.7 0 0 0 0 1l-2 1.6 2 3.4 2.4-.9c.5.4 1.1.7 1.7 1L12.8 20h4l.5-2.4c.6-.3 1.2-.6 1.7-1l2.4.9 2-3.4-2-1.6Z"/>
        </svg>
      </button>
    </header>

    <section class="primary-action">
      <button id="save-btn" class="save-btn" type="button">
        <span class="save-btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm2 1v5h8V4H7Zm0 9v7h10v-7H7Z"/></svg>
        </span>
        <span class="save-btn-label" id="save-btn-label">Save tabs</span>
        <span class="save-btn-hint" id="save-btn-hint"></span>
      </button>
    </section>

    <section class="sessions" aria-labelledby="sessions-h">
      <h2 id="sessions-h" data-i18n="sessionsHeading">Recent sessions</h2>
      <ul id="session-list" class="session-list" role="list"></ul>
      <p id="empty-state" class="empty-state" data-i18n="emptyState" hidden>
        No sessions yet — save your first batch above.
      </p>
    </section>

    <footer class="footer">
      <span id="footer-stats" class="stats"></span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <input id="import-file" type="file" accept="application/json" hidden />

    <script type="module" src="popup.js"></script>
  </body>
</html>
